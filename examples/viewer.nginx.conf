# Example only: replace hostname and certificate paths before enabling.
server {
    listen 443 ssl;
    server_name rail.example.com;
    ssl_certificate /etc/letsencrypt/live/rail.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rail.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 4k;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
        proxy_send_timeout 15s;
    }
}
